<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Watched Movie Tracker</title>
</head>
<body>
    <div class="app">
        <header class="app-header">
            <div class="app-header__titles">
                <h1 class="app-header_title"><a href="/">Watched Movie Tracker</a></h1>
                <p class="app-header__subtitle">Add the movie to your watched list or find a movie you have already added</p>
            </div>

            <button type="button" id="toggle-mode-btn" class="btn btn--secondary" data-mode="add">
                Switch to Search Mode
            </button>
        </header>
        <main class="app-main">
            <section class="panel panel--left">
                <!-- Форма добавления фильма в список просмотренных -->
                <form id="add-movie-form" class="form">
                    <h2 class="form__header">Add Movie</h2>
                    <div class="form__group">
                        <label for="add-title">Movie Title</label>
                        <input type="text" id="add-title" class="form__input form__input--text" name="title" required placeholder="For Example 'Fight Club'...">
                    </div>
                    <div class="form__group">
                        <label for="add-date">Choose Release Date</label>
                        <input type="date" id="add-date" class="form__input form__input--date" name="releaseDate" required >
                    </div>
                    
                    <div class="form__group">
                        <label for="add-rating">Rating (from 1 to 5)</label>
                        <div class="range-wrapper">
                            <input type="range" id="add-rating" class="form__input form__input--range" name="rating" min="1" max="5" value="5" step="1" required>
                            <output id="rating-value" for="add-rating">5 ⭐</output>
                        </div>
                    </div>

                    <div class="form__group">
                        <label for="add-review">Your own opinion:</label>
                        <textarea id="add-review" class="form__input form__input--textarea" name="review" rows="4" placeholder="Describe what you liked/didn'r like or something else..."></textarea>
                    </div>
                    
                    <button type="submit" class="btn btn--primary">
                        Add Movie
                    </button>
                </form>

                <form id="search-movie-form" class="form hidden">
                    <h2 class="form__header">Search Movie</h2>
                    <div class="form__group">
                        <label for="search-id">Movie's ID</label>
                        <input type="text" id="search-id" class="form__input form__input--text" name="id" required placeholder="Enter ID for search">
                    </div>

                    <button type="submit" class="btn btn--primary">
                        Search Movie
                    </button>
                </form>
            </section>
            <section class="panel panel--right">
                <h2>Information</h2>
                <div id="result-container" class="result">
                    <p class="result__placeholder">Information about the added or found movie will appear here.</p>
                </div>
            </section>
        </main>
    </div>
    <script src="main.js" defer></script>
</body>
</html>
